[package]
name = "tmatrix-core"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
matrix-sdk = { version = "0.19", default-features = false, features = ["rustls-aws-lc-rs", "e2e-encryption", "sqlite", "bundled-sqlite", "markdown", "automatic-room-key-forwarding", "sso-login"] }
matrix-sdk-ui = { version = "0.19", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
mime = "0.3"
mime_guess = "2"
eyeball-im = "0.9"
imbl = "7"
libc = "0.2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[profile.release]
lto = false
codegen-units = 16
strip = "debuginfo"
